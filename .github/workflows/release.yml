name: Release

# A pushed tag v<version> builds Release x64, packs it with Tools/Package-Release.ps1 and publishes a
# GitHub release with the zip files. The text comes from .github/release-notes/<tag>.md; the SHA-256
# sums of the files are added below it. Pushing the same tag again (deleted and set anew) replaces the
# files and the text of that release. The tests ran in "Build and test" for the commit on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Tools the build needs
        shell: pwsh
        run: |
          python --version
          dotnet --version

      - name: Build Release x64
        run: msbuild Manifold-Engine.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64

      - name: Pack
        id: pack
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $sums = & ./Tools/Package-Release.ps1 -Version $version -Destination dist
          $sums | ForEach-Object { Write-Output $_ }
          $notes = ".github/release-notes/$tag.md"
          $text = if (Test-Path $notes) { Get-Content -Raw -Encoding utf8 $notes } else { "Manifold Engine $version." }
          $text += "`n`n### SHA-256`n`n``````text`n" + (($sums | ForEach-Object { ($_ -split '  ')[0..1] -join '  ' }) -join "`n") + "`n```````n"
          Set-Content -Encoding utf8 -Path dist/notes.md -Value $text
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = 'Manifold Engine ${{ steps.pack.outputs.version }}'
          $files = Get-ChildItem dist -Filter *.zip | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0)
          {
            gh release edit $tag --title $title --notes-file dist/notes.md
            gh release upload $tag @files --clobber
          }
          else
          {
            gh release create $tag @files --title $title --notes-file dist/notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
